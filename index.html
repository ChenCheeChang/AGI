<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#286E46" />
  <title>LINE FRIENDS 積木日曆俄羅斯方塊</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      overscroll-behavior: none;
    }
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: #1E5636;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      color: #2C1D14;
    }
    body.playing { overflow: hidden; touch-action: none; }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #2A7A4A 0%, #1E5636 55%, #163D26 100%);
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 500px) {
      .app-shell {
        border-radius: 16px;
        max-height: 900px;
        margin: 10px auto;
        height: calc(100dvh - 20px);
        border: 3px solid #1C5232;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      }
    }

    /* ===== 頂部精簡列：品牌 + 分數 ===== */
    .top-slim {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 4px;
      gap: 8px;
      background: rgba(0,0,0,0.18);
    }
    .brand {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .score-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 42, 26, 0.9);
      border-radius: 999px;
      padding: 4px 12px;
      border: 1.5px solid rgba(255,255,255,0.12);
    }
    .score-pill .s-item {
      text-align: center;
      line-height: 1.15;
    }
    .score-pill .s-label {
      font-size: 9px;
      color: #A7F3D0;
      font-weight: 700;
    }
    .score-pill .s-val {
      font-size: 15px;
      font-weight: 900;
      color: #FCD34D;
    }
    .score-pill .s-val.small {
      font-size: 12px;
      color: #fff;
    }

    /* 迷你功能列（極簡） */
    .mini-utils {
      flex: 0 0 auto;
      display: flex;
      gap: 4px;
      padding: 2px 8px 4px;
      justify-content: center;
    }
    .mini-btn {
      border: none;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    .mini-btn.on { background: #0E7490; }
    .mini-btn.test { background: #D97706; }

    /* ===== 遊戲區（最大） ===== */
    .play-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 4px;
      gap: 3px;
    }
    .board-well {
      flex: 1 1 auto;
      min-height: 0;
      background: #0F2A1A;
      border-radius: 10px;
      box-shadow: inset 0 4px 14px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 2px solid #0A1F12;
    }
    #gameCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      border-radius: 6px;
      cursor: pointer;
      touch-action: none;
    }
    .bubble-layer {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden; z-index: 20;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(180,235,255,0.4) 60%, rgba(100,190,255,0.18));
      box-shadow: inset 0 0 4px rgba(255,255,255,0.75), 0 0 6px rgba(150,220,255,0.45);
      animation: rise linear forwards;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.85); opacity: 0.95; }
      70% { transform: translateY(-85px) scale(1.1); opacity: 0.85; }
      100% { transform: translateY(-130px) scale(1.25); opacity: 0; }
    }
    .celebration-toast {
      position: absolute; top: 36%; left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: rgba(251, 191, 36, 0.96);
      color: #3A241B; font-weight: 900; font-size: 15px;
      padding: 7px 16px; border-radius: 14px;
      border: 3px solid #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 30;
    }
    .celebration-toast.show {
      opacity: 1; transform: translate(-50%, -50%) scale(1);
    }

    /* NEXT / HOLD 迷你列（緊湊） */
    .preview-row {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      padding: 0 2px;
    }
    .preview-box {
      background: rgba(13, 36, 24, 0.9);
      border-radius: 8px;
      padding: 3px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .preview-box span {
      font-size: 9px;
      font-weight: 800;
      color: #A7F3D0;
      margin-bottom: 1px;
    }
    .preview-box canvas {
      width: 44px; height: 44px;
    }
    .energy-mini {
      flex: 1;
      max-width: 120px;
      height: 8px;
      background: #1A100C;
      border-radius: 999px;
      overflow: hidden;
      margin: 0 4px;
    }
    .energy-mini .fill {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #FBBF24);
      border-radius: 999px;
      transition: width 0.3s;
    }

    /* ===== 底部控制（只保留方向 + 旋轉 + 落地） ===== */
    .controls {
      flex: 0 0 auto;
      padding: 5px 8px calc(6px + var(--safe-bottom));
      background: rgba(0,0,0,0.2);
    }
    .pad-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 5px;
    }
    .pad-btn {
      background: #F7F6F0;
      color: #3A241B;
      border: none;
      border-radius: 12px;
      height: 46px;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 3px 0 #C8C2B4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .pad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #C8C2B4;
    }
    .pad-rotate {
      background: #D9822B;
      color: #fff;
      box-shadow: 0 3px 0 #A65F1A;
    }
    .pad-drop {
      background: linear-gradient(180deg, #7393B3, #52718F);
      color: #fff;
      box-shadow: 0 3px 0 #3A556B;
    }
    .skill-mini {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .skill-mini button {
      flex: 1;
      border: none;
      border-radius: 10px;
      height: 36px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .skill-b { background: #FBBF24; color: #3A241B; }
    .skill-g { background: #FB923C; color: #fff; }

    .overlay {
      position: absolute; inset: 0;
      background: rgba(10, 30, 18, 0.93);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 40; padding: 20px; text-align: center;
    }
    .overlay h1 { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .overlay p { font-size: 12px; color: #A7F3D0; line-height: 1.5; max-width: 260px; margin-bottom: 14px; }
    .start-btn {
      background: linear-gradient(180deg, #FBBF24, #F59E0B);
      color: #3A241B; border: none; border-radius: 14px;
      padding: 11px 24px; font-size: 15px; font-weight: 900;
      box-shadow: 0 4px 0 #B45309; cursor: pointer;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #FFF8EB; border-radius: 16px;
      max-width: 340px; width: 100%; max-height: 75vh;
      overflow-y: auto; padding: 16px;
    }
    .modal-card h2 { font-size: 16px; font-weight: 900; color: #1E5636; margin-bottom: 8px; }
    .modal-card ul { font-size: 12px; color: #3A241B; line-height: 1.5; padding-left: 16px; }
    .modal-card li { margin-bottom: 5px; }
    .close-modal {
      margin-top: 12px; width: 100%; background: #1E5636; color: #fff;
      border: none; border-radius: 10px; padding: 9px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 頂部：品牌 + 分數（一目了然） -->
    <div class="top-slim">
      <div class="brand">🧸 積木日曆</div>
      <div class="score-pill">
        <div class="s-item">
          <div class="s-label">分數</div>
          <div class="s-val" id="scoreVal">0</div>
        </div>
        <div class="s-item">
          <div class="s-label">休假</div>
          <div class="s-val small" id="linesVal">0天</div>
        </div>
        <div class="s-item">
          <div class="s-label">等級</div>
          <div class="s-val small" id="levelVal">Lv.1</div>
        </div>
      </div>
    </div>

    <!-- 迷你功能 -->
    <div class="mini-utils">
      <button class="mini-btn on" id="btnToggleBgm" type="button">🎵 音樂</button>
      <button class="mini-btn on" id="btnToggleSfx" type="button">🫧 音效</button>
      <button class="mini-btn test" id="btnTestBubble" type="button">啵啵試聽</button>
      <button class="mini-btn" id="btnHelp" type="button">?</button>
    </div>

    <!-- 遊戲區（最大） -->
    <div class="play-area">
      <div class="board-well" id="boardWell">
        <canvas id="gameCanvas" width="300" height="540"></canvas>
        <div class="bubble-layer" id="bubbleLayer"></div>
        <div class="celebration-toast" id="celebrationToast">🏖️ 休假囉！啵啵！</div>
        <div class="overlay" id="startOverlay">
          <h1>LINE FRIENDS 日曆方塊</h1>
          <p>堆疊樂高凸點日期方塊，湊滿整行翻轉成「休」字放假！</p>
          <button class="start-btn" id="btnStart">▶️ 開始堆疊</button>
        </div>
      </div>

      <!-- NEXT / HOLD + 能量條 -->
      <div class="preview-row">
        <div class="preview-box" id="holdWellBox">
          <span>HOLD</span>
          <canvas id="holdCanvas" width="44" height="44"></canvas>
        </div>
        <div class="energy-mini"><div class="fill" id="energyFill" style="width:100%"></div></div>
        <div class="preview-box">
          <span>NEXT</span>
          <canvas id="nextCanvas" width="44" height="44"></canvas>
        </div>
      </div>
    </div>

    <!-- 控制區：方向 + 旋轉 + 落地 -->
    <div class="controls">
      <div class="pad-row">
        <button class="pad-btn" id="btnLeft" type="button">◀</button>
        <button class="pad-btn pad-rotate" id="btnRotate" type="button">↻</button>
        <button class="pad-btn" id="btnDown" type="button">▼</button>
        <button class="pad-btn" id="btnRight" type="button">▶</button>
        <button class="pad-btn pad-drop" id="btnDrop" type="button">⏬</button>
      </div>
      <div class="skill-mini">
        <button class="skill-b" id="btnBrownLine" type="button">🏖️ 熊大消一行</button>
        <button class="skill-g" id="btnBrownGift" type="button">🎁 休假禮盒</button>
        <button class="pad-btn" id="btnPause" type="button" style="flex:0.4;height:36px;font-size:14px;background:#1F5837;color:#fff;box-shadow:none;">⏸</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal">
    <div class="modal-card">
      <h2>🧸 玩法說明</h2>
      <ul>
        <li>湊滿整行 → 翻轉成「休」字放假積木</li>
        <li>左右移動 / 旋轉 / 加速 / 硬降</li>
        <li>B：熊大消一行　G：召喚休假禮盒</li>
        <li>鍵盤：←→↑↓ 空白 C B G P</li>
      </ul>
      <button class="close-modal" id="btnCloseHelp">知道了</button>
    </div>
  </div>

<script>
    // =========================================================================
    // 1. Q彈水滴泡泡音效 + 輕快有趣木琴背景音樂合成器 (Web Audio API)
    // =========================================================================
    let audioCtx = null;
    let sfxOn = true;
    let bgmOn = true;
    let bgmTimer = null;
    let bgmStep = 0;

    const BGM_STYLES = [
      { key: 'party',    label: '🎶 曲風: 泡泡派對' },
      { key: 'stroll',   label: '🎶 曲風: 午後散步' },
      { key: 'carnival', label: '🎶 曲風: 莎莉嘉年華' }
    ];
    let bgmStyleIdx = 0;

    function ensureAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    /**
     * 核心：真實水滴氣泡聲學滑音 (Upward Sine Pitch Sweep + 泛音)
     * 真實水泡在破裂前共振腔縮小，頻率是由低往高指數上滑（Bloop!）
     */
    function playBubbleSweep(startFreq, endFreq, duration = 0.075, volume = 0.24, delay = 0) {
      if (!sfxOn) return;
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime + delay;

        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const gain = ctx.createGain();
        const subGain = ctx.createGain();

        // 主水泡正弦波：由低往高急速滑音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(Math.max(40, startFreq), t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(60, endFreq), t0 + duration);

        // 1.5倍頻三角波泛音：增加卡通水珠的晶瑩光澤感
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(Math.max(60, startFreq * 1.5), t0);
        subOsc.frequency.exponentialRampToValueAtTime(Math.max(90, endFreq * 1.5), t0 + duration);

        subGain.gain.setValueAtTime(0.16, t0);
        subGain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(volume, t0 + duration * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.0008, t0 + duration);

        osc.connect(gain);
        subOsc.connect(subGain);
        subGain.connect(gain);
        gain.connect(ctx.destination);

        osc.start(t0);
        subOsc.start(t0);
        osc.stop(t0 + duration + 0.015);
        subOsc.stop(t0 + duration + 0.015);
      } catch (e) {}
    }

    // 輕快木琴音色 (供背景音樂與消行慶祝和弦使用)
    function playToyMarimba(freq, duration = 0.15, delay = 0, wave = 'triangle', volume = 0.11) {
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = wave;
        // 玩具木琴敲擊瞬間微幅高音彈性
        osc.frequency.setValueAtTime(freq * 1.025, t0);
        osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.025);

        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0008, t0 + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + duration + 0.015);
      } catch (e) {}
    }

    // 左右移動：清脆單顆水泡 (低->高)
    function sfxMove() {
      const base = 330 + Math.random() * 50;
      playBubbleSweep(base, base * 2.25, 0.06, 0.20, 0);
    }

    // 旋轉：活潑雙連音啵啵 (Bloop-Bip!)
    function sfxRotate() {
      playBubbleSweep(340, 740, 0.055, 0.21, 0);
      playBubbleSweep(520, 1140, 0.065, 0.23, 0.045);
    }

    // 軟降 / 一般落地：溫潤水珠聲
    function sfxSoftDrop() {
      playBubbleSweep(260, 560, 0.055, 0.16, 0);
    }

    // 空白鍵硬降：飽滿深水氣泡 + 三顆上升小氣泡濺起
    function sfxHardDrop() {
      playBubbleSweep(190, 480, 0.085, 0.28, 0);
      playBubbleSweep(420, 900, 0.06, 0.22, 0.035);
      playBubbleSweep(560, 1180, 0.06, 0.20, 0.07);
      playBubbleSweep(720, 1460, 0.055, 0.18, 0.105);
    }

    // 消行：晶瑩八連音泡泡音階 + 歡樂木琴大三和弦
    function sfxLineClear(count = 1) {
      const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
      const total = Math.min(8, 4 + count);
      for (let i = 0; i < total; i++) {
        const f = scale[i % scale.length];
        playBubbleSweep(f * 0.65, f * 1.45, 0.075, 0.24, i * 0.042);
      }
      if (sfxOn) {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          playToyMarimba(freq, 0.26, idx * 0.055, 'triangle', 0.14);
        });
      }
    }

    // 啵啵試聽：五連音階梯氣泡 + 畫面浮動泡泡粒子
    function sfxTestFive() {
      const pitches = [300, 390, 500, 640, 820];
      pitches.forEach((p, i) => {
        playBubbleSweep(p, p * 2.2, 0.072, 0.25, i * 0.06);
      });
      spawnBubbleParticles(14);
    }

    // ========== 輕快有趣背景音樂 Sequencer ==========
    const NOTES = {
      C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, C6: 1046.50
    };

    const BGM_PATTERNS = {
      party: {
        lead: [
          NOTES.E5, 0, NOTES.G5, NOTES.E5, NOTES.C5, 0, NOTES.D5, 0,
          NOTES.E5, NOTES.G5, NOTES.A5, NOTES.G5, NOTES.E5, 0, NOTES.G5, 0,
          NOTES.F5, 0, NOTES.A5, NOTES.F5, NOTES.D5, 0, NOTES.G5, 0,
          NOTES.E5, NOTES.D5, NOTES.C5, NOTES.D5, NOTES.E5, NOTES.G5, NOTES.C6, 0
        ],
        bass: [
          NOTES.C3, 0, NOTES.G3, 0, NOTES.C3, 0, NOTES.G3, 0,
          NOTES.A3, 0, NOTES.E3, 0, NOTES.A3, 0, NOTES.E3, 0,
          NOTES.F3, 0, NOTES.C4, 0, NOTES.G3, 0, NOTES.D4, 0,
          NOTES.C3, 0, NOTES.G3, 0, NOTES.C4, 0, NOTES.G3, 0
        ]
      },
      stroll: {
        lead: [
          NOTES.G5, 0, NOTES.E5, 0, NOTES.C5, NOTES.D5, NOTES.E5, 0,
          NOTES.A5, 0, NOTES.G5, 0, NOTES.E5, 0, NOTES.D5, 0,
          NOTES.F5, 0, NOTES.E5, 0, NOTES.D5, NOTES.E5, NOTES.G5, 0,
          NOTES.E5, 0, NOTES.D5, 0, NOTES.C5, 0, 0, 0
        ],
        bass: [
          NOTES.C3, 0, 0, NOTES.G3, NOTES.C3, 0, NOTES.G3, 0,
          NOTES.F3, 0, 0, NOTES.C4, NOTES.F3, 0, NOTES.C4, 0,
          NOTES.G3, 0, 0, NOTES.D4, NOTES.G3, 0, NOTES.D4, 0,
          NOTES.C3, 0, NOTES.G3, 0, NOTES.C4, 0, 0, 0
        ]
      },
      carnival: {
        lead: [
          NOTES.C5, NOTES.E5, NOTES.G5, NOTES.E5, NOTES.A5, NOTES.G5, NOTES.E5, NOTES.C5,
          NOTES.D5, NOTES.F5, NOTES.A5, NOTES.F5, NOTES.G5, 0, NOTES.G5, 0,
          NOTES.E5, NOTES.G5, NOTES.C6, NOTES.G5, NOTES.A5, NOTES.F5, NOTES.D5, NOTES.F5,
          NOTES.E5, NOTES.G5, NOTES.D5, NOTES.B4, NOTES.C5, 0, NOTES.C6, 0
        ],
        bass: [
          NOTES.C3, NOTES.G3, NOTES.C3, NOTES.G3, NOTES.F3, NOTES.C4, NOTES.F3, NOTES.C4,
          NOTES.D3, NOTES.A3, NOTES.D3, NOTES.A3, NOTES.G3, NOTES.D4, NOTES.G3, NOTES.D4,
          NOTES.C3, NOTES.G3, NOTES.E3, NOTES.G3, NOTES.F3, NOTES.C4, NOTES.D3, NOTES.A3,
          NOTES.G3, NOTES.D4, NOTES.G3, NOTES.B3, NOTES.C4, 0, NOTES.C3, 0
        ]
      }
    };

    function tickBgmSequencer() {
      if (!bgmOn || paused) return;
      const ctx = ensureAudio();
      if (!ctx || ctx.state === 'suspended') return;

      const styleKey = BGM_STYLES[bgmStyleIdx].key;
      const pat = BGM_PATTERNS[styleKey] || BGM_PATTERNS.party;
      const step = bgmStep % 32;
      const lead = pat.lead[step];
      const bass = pat.bass[step];

      if (lead) {
        playToyMarimba(lead, 0.14, 0, 'triangle', 0.095);
        playToyMarimba(lead * 2, 0.075, 0, 'sine', 0.032);
      }
      if (bass) {
        playToyMarimba(bass, 0.16, 0, 'sine', 0.11);
      }
      // 每隔 4 拍加入一個極輕巧的背景水泡節奏點，讓旋律更俏皮
      if (step % 4 === 2 && sfxOn) {
        playBubbleSweep(480, 860, 0.032, 0.055, 0);
      }
      bgmStep = (bgmStep + 1) % 32;
    }

    function startBgmLoop() {
      ensureAudio();
      if (bgmTimer) clearInterval(bgmTimer);
      bgmTimer = setInterval(tickBgmSequencer, 165);
    }

    function stopBgmLoop() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
    }

    // 畫面浮動泡泡粒子
    function spawnBubbleParticles(count = 8) {
      const layer = document.getElementById('bubbleLayer');
      if (!layer) return;
      for (let i = 0; i < count; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 9 + Math.random() * 18;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (Math.random() * 88 + 6) + '%';
        b.style.bottom = (Math.random() * 35 + 5) + '%';
        b.style.animationDuration = (0.85 + Math.random() * 1.0) + 's';
        b.style.animationDelay = (Math.random() * 0.2) + 's';
        layer.appendChild(b);
        setTimeout(() => b.remove(), 2100);
      }
    }

    function showCelebrationToast(text) {
      const toast = document.getElementById('celebrationToast');
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showCelebrationToast._t);
      showCelebrationToast._t = setTimeout(() => {
        toast.classList.remove('show');
      }, 1350);
    }

    // =========================================================================
    // 2. 遊戲核心 (立體樂高日曆方塊 + 「休」字翻轉動畫)
    // =========================================================================
    const COLS = 10, ROWS = 18;
    let CELL = 30;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const holdCanvas = document.getElementById('holdCanvas');
    const holdCtx = holdCanvas.getContext('2d');

    const SHAPES = {
      I: [[1,1,1,1]],
      O: [[1,1],[1,1]],
      T: [[0,1,0],[1,1,1]],
      S: [[0,1,1],[1,1,0]],
      Z: [[1,1,0],[0,1,1]],
      J: [[1,0,0],[1,1,1]],
      L: [[0,0,1],[1,1,1]]
    };

    const ICON_THEMES = [
      { color: '#D9822B', text: '#FFFFFF', icon: '🐰' },
      { color: '#3A241B', text: '#FCD34D', icon: '🐻' },
      { color: '#7393B3', text: '#FFFFFF', icon: '🐥' },
      { color: '#2F7D53', text: '#FFFFFF', icon: '🌵' },
      { color: '#D9822B', text: '#FFFFFF', icon: '🍦' },
      { color: '#3A241B', text: '#FCD34D', icon: '🌸' },
      { color: '#7393B3', text: '#FFFFFF', icon: '🪴' },
      { color: '#2F7D53', text: '#FFFFFF', icon: '🌱' }
    ];

    let board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    let current = null, next = null, hold = null, canHold = true;
    let dateCounter = 1;
    let score = 0, lines = 0, level = 1, energy = 100;
    let dropInterval = 800, lastDrop = 0, paused = false, gameOver = false, started = false;
    let isClearingAnim = false;
    let best = parseInt(localStorage.getItem('lf_calendar_best') || '0', 10);

    function resizeCanvas() {
      const well = document.getElementById('boardWell');
      const maxW = well.clientWidth - 8;
      const maxH = well.clientHeight - 8;
      CELL = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
      CELL = Math.max(18, Math.min(CELL, 36));
      canvas.width = COLS * CELL;
      canvas.height = ROWS * CELL;
      canvas.style.width = canvas.width + 'px';
      canvas.style.height = canvas.height + 'px';
      draw();
    }

    function createCellTile(forceDateMode, themePick) {
      if (Math.random() < 0.12) {
        return { color: '#FFF3C4', textColor: '#C83E2B', label: '休', isHoliday: true };
      }
      if (forceDateMode) {
        const d = dateCounter;
        dateCounter = (dateCounter % 31) + 1;
        return { color: '#F7F6F0', textColor: '#3A241B', label: String(d), isDate: true };
      }
      return { color: themePick.color, textColor: themePick.text, label: themePick.icon, isIcon: true };
    }

    function randomPiece() {
      const keys = Object.keys(SHAPES);
      const type = keys[Math.floor(Math.random() * keys.length)];
      const rawShape = SHAPES[type];
      const useDateMode = Math.random() < 0.52;
      const themePick = ICON_THEMES[Math.floor(Math.random() * ICON_THEMES.length)];

      const shape = rawShape.map(row =>
        row.map(v => (v ? createCellTile(useDateMode, themePick) : null))
      );

      return {
        shape,
        type,
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0
      };
    }

    function collide(piece, dx=0, dy=0, rot=null) {
      const s = rot || piece.shape;
      for (let r=0; r<s.length; r++) {
        for (let c=0; c<s[r].length; c++) {
          if (!s[r][c]) continue;
          const nx = piece.x + c + dx;
          const ny = piece.y + r + dy;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function merge() {
      const s = current.shape;
      for (let r=0; r<s.length; r++) {
        for (let c=0; c<s[r].length; c++) {
          if (s[r][c] && current.y + r >= 0) {
            const by = current.y + r;
            const bx = current.x + c;
            board[by][bx] = s[r][c];
            // 熊大休假禮盒落地時，將上下左右相鄰方塊也染成「休」字積木！
            if (current.type === 'GIFT') {
              [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr, dc]) => {
                const nr = by + dr, nc = bx + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc]) {
                  board[nr][nc] = { color: '#FFF3C4', textColor: '#C83E2B', label: '休', isHoliday: true };
                }
              });
            }
          }
        }
      }
    }

    function checkAndClearLines() {
      const fullRows = [];
      for (let r = 0; r < ROWS; r++) {
        if (board[r].every(cell => cell !== null)) {
          fullRows.push(r);
        }
      }

      if (fullRows.length === 0) {
        spawn();
        return;
      }

      // 整排先翻轉為金黃色「休」字放假積木並播放慶祝泡泡音！
      isClearingAnim = true;
      fullRows.forEach(r => {
        for (let c = 0; c < COLS; c++) {
          board[r][c] = { color: '#FFF3C4', textColor: '#C83E2B', label: '休', isHoliday: true };
        }
      });

      const cleared = fullRows.length;
      sfxLineClear(cleared);
      spawnBubbleParticles(8 + cleared * 4);
      const msgs = ['', '🏖️ 休假 +1 天！啵啵！', '🎉 雙連休 DOUBLE 放假！', '✨ 三連休 TRIPLE 假期！', '👑 四連休黃金週 TETRIS！'];
      showCelebrationToast(msgs[cleared] || msgs[4]);
      draw();

      setTimeout(() => {
        board = board.filter((_, idx) => !fullRows.includes(idx));
        while (board.length < ROWS) {
          board.unshift(Array(COLS).fill(null));
        }

        lines += cleared;
        score += ([0, 150, 400, 800, 1600][cleared] || 1600) * level;
        level = Math.min(15, 1 + Math.floor(lines / 5));
        dropInterval = Math.max(150, 800 - (level - 1) * 48);
        energy = Math.min(100, energy + cleared * 20);

        document.getElementById('linesVal').textContent = lines;
        document.getElementById('scoreVal').textContent = score;
        document.getElementById('levelVal').textContent = 'Lv.' + level;
        document.getElementById('linesVal').textContent = lines + '天';
        updateEnergy();

        if (score > best) {
          best = score;
          localStorage.setItem('lf_calendar_best', best);
        }

        isClearingAnim = false;
        spawn();
        draw();
      }, 360);
    }

    function rotateMatrix(shape) {
      const N = shape.length, M = shape[0].length;
      const res = Array.from({length: M}, () => Array(N).fill(null));
      for (let r=0; r<N; r++) {
        for (let c=0; c<M; c++) {
          res[c][N-1-r] = shape[r][c];
        }
      }
      return res;
    }

    function spawn() {
      current = next || randomPiece();
      next = randomPiece();
      canHold = true;
      if (collide(current)) {
        gameOver = true;
        started = false;
        document.body.classList.remove('playing');
        document.getElementById('startOverlay').style.display = 'flex';
        document.getElementById('startOverlay').querySelector('h1').textContent = '📅 本月日曆堆滿囉！';
        document.getElementById('startOverlay').querySelector('p').textContent = `累積休假 ${lines} 天 · 分數 ${score} · 最高 ${best}`;
        document.getElementById('btnStart').textContent = '🔄 再玩一局';
      }
      drawNext();
    }

    function holdPiece() {
      if (!canHold || !current || paused || isClearingAnim) return;
      ensureAudio();
      if (!hold) {
        hold = current;
        spawn();
      } else {
        const tmp = hold;
        hold = current;
        current = tmp;
        current.x = Math.floor((COLS - current.shape[0].length)/2);
        current.y = 0;
      }
      canHold = false;
      drawHold();
      sfxRotate();
      draw();
    }

    function hardDrop() {
      if (!current || paused || isClearingAnim) return;
      ensureAudio();
      let dropped = 0;
      while (!collide(current, 0, 1)) {
        current.y++;
        dropped++;
      }
      score += dropped * 2;
      document.getElementById('scoreVal').textContent = score;
      merge();
      sfxHardDrop();
      spawnBubbleParticles(10);
      checkAndClearLines();
      draw();
    }

    function softDrop() {
      if (!current || paused || isClearingAnim) return;
      if (!collide(current, 0, 1)) {
        current.y++;
        score += 1;
        document.getElementById('scoreVal').textContent = score;
        sfxSoftDrop();
      } else {
        merge();
        sfxSoftDrop();
        checkAndClearLines();
      }
      draw();
    }

    function move(dx) {
      if (!current || paused || isClearingAnim) return;
      ensureAudio();
      if (!collide(current, dx, 0)) {
        current.x += dx;
        sfxMove();
        spawnBubbleParticles(2);
        draw();
      }
    }

    function doRotate() {
      if (!current || paused || isClearingAnim) return;
      ensureAudio();
      const rotated = rotateMatrix(current.shape);
      const kicks = [0, -1, 1, -2, 2];
      for (const k of kicks) {
        if (!collide(current, k, 0, rotated)) {
          current.shape = rotated;
          current.x += k;
          sfxRotate();
          spawnBubbleParticles(4);
          draw();
          return;
        }
      }
    }

    function updateEnergy() {
      document.getElementById('energyFill').style.width = energy + '%';
      (document.getElementById('energyPct') || {textContent:''}).textContent = energy >= 50 ? `${energy}% READY!` : `${energy}% 充能中`;
    }

    // 熊大技能 B：直接將最底層有方塊的那一行變成「休」字消除！
    function brownClearLine() {
      if (!started || paused || isClearingAnim) return;
      ensureAudio();
      if (energy < 50) {
        showCelebrationToast('🐻 能量滿 50% 才能幫消一行喔！');
        sfxMove();
        return;
      }
      energy -= 50;
      updateEnergy();

      let targetRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].some(c => c !== null)) {
          targetRow = r;
          break;
        }
      }
      for (let c = 0; c < COLS; c++) {
        board[targetRow][c] = { color: '#FFF3C4', textColor: '#C83E2B', label: '休', isHoliday: true };
      }
      checkAndClearLines();
    }

    // 熊大技能 G：召喚單格百搭「休」字禮盒
    function brownGift() {
      if (!started || paused || isClearingAnim) return;
      ensureAudio();
      if (energy < 30) {
        showCelebrationToast('🎁 能量滿 30% 可召喚休假禮盒！');
        sfxMove();
        return;
      }
      energy -= 30;
      updateEnergy();
      next = {
        shape: [[{ color: '#FFF3C4', textColor: '#C83E2B', label: '🎁', isHoliday: true }]],
        type: 'GIFT',
        x: 4,
        y: 0
      };
      drawNext();
      sfxRotate();
      showCelebrationToast('🎁 下一個是百搭休假禮盒！');
    }

    // 繪製立體樂高凸點日曆方塊
    function drawLegoBlock(targetCtx, x, y, size, cellData) {
      if (!cellData) return;
      const color = cellData.color || '#F7F6F0';
      const textColor = cellData.textColor || '#3A241B';
      const label = cellData.label;

      // 頂部樂高圓柱凸點 (Stud)
      const studW = size * 0.46;
      const studH = Math.max(2.5, size * 0.13);
      targetCtx.fillStyle = color;
      targetCtx.beginPath();
      targetCtx.roundRect(x + (size - studW) / 2, y + 0.5, studW, studH + 2, [2, 2, 0, 0]);
      targetCtx.fill();

      // 主方塊圓角本體
      const bodyY = y + studH * 0.85;
      const bodyH = size - studH * 0.85 - 1;
      targetCtx.fillStyle = color;
      targetCtx.beginPath();
      targetCtx.roundRect(x + 1, bodyY, size - 2, bodyH, 4.5);
      targetCtx.fill();

      // 3D 高光與陰影邊框
      targetCtx.strokeStyle = 'rgba(0,0,0,0.22)';
      targetCtx.lineWidth = 1.2;
      targetCtx.stroke();

      targetCtx.fillStyle = 'rgba(255,255,255,0.32)';
      targetCtx.beginPath();
      targetCtx.roundRect(x + 2.5, bodyY + 1.5, size - 5, bodyH * 0.28, 2);
      targetCtx.fill();

      // 繪製日期數字、「休」字或角色圖示
      if (label && size >= 15) {
        targetCtx.fillStyle = textColor;
        const fontSize = cellData.isHoliday || cellData.isDate
          ? Math.floor(size * 0.44)
          : Math.floor(size * 0.46);
        targetCtx.font = `900 ${fontSize}px "Fredoka", "Noto Sans TC", sans-serif`;
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(label, x + size / 2, bodyY + bodyH * 0.54);
      }
    }

    function draw() {
      ctx.fillStyle = '#153B25';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 樂高底板格線與圓形凹槽
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * CELL, y = r * CELL;
          ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
          if (!board[r][c]) {
            ctx.beginPath();
            ctx.arc(x + CELL/2, y + CELL/2 + 1, CELL * 0.16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fill();
          }
        }
      }

      // 已鎖定的日曆積木
      for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
          if (board[r][c]) {
            drawLegoBlock(ctx, c*CELL, r*CELL, CELL, board[r][c]);
          }
        }
      }

      // 當前下落方塊與落地影子 (Ghost)
      if (current && !isClearingAnim) {
        const s = current.shape;
        let gy = current.y;
        while (!collide(current, 0, gy - current.y + 1)) gy++;

        ctx.save();
        ctx.globalAlpha = 0.22;
        for (let r=0; r<s.length; r++) {
          for (let c=0; c<s[r].length; c++) {
            if (s[r][c]) {
              drawLegoBlock(ctx, (current.x+c)*CELL, (gy+r)*CELL, CELL, s[r][c]);
            }
          }
        }
        ctx.restore();

        for (let r=0; r<s.length; r++) {
          for (let c=0; c<s[r].length; c++) {
            if (s[r][c]) {
              drawLegoBlock(ctx, (current.x+c)*CELL, (current.y+r)*CELL, CELL, s[r][c]);
            }
          }
        }
      }
    }

    function drawMiniPreview(targetCtx, piece) {
      targetCtx.clearRect(0, 0, 52, 52);
      if (!piece) return;
      const s = piece.shape;
      const cell = Math.min(16, 46 / Math.max(s.length, s[0].length));
      const ox = (52 - s[0].length * cell) / 2;
      const oy = (52 - s.length * cell) / 2;
      for (let r=0; r<s.length; r++) {
        for (let c=0; c<s[r].length; c++) {
          if (s[r][c]) drawLegoBlock(targetCtx, ox + c*cell, oy + r*cell, cell, s[r][c]);
        }
      }
    }

    function drawNext() { drawMiniPreview(nextCtx, next); }
    function drawHold() { drawMiniPreview(holdCtx, hold); }

    function loop(t) {
      if (started && !paused && !gameOver && !isClearingAnim) {
        if (t - lastDrop > dropInterval) {
          softDrop();
          lastDrop = t;
        }
        draw();
      }
      requestAnimationFrame(loop);
    }

    function startGame() {
      ensureAudio();
      sfxTestFive();
      if (bgmOn) startBgmLoop();

      board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
      score = 0; lines = 0; level = 1; energy = 100; dateCounter = 1;
      hold = null; canHold = true; isClearingAnim = false;
      dropInterval = 800; gameOver = false; paused = false; started = true;

      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('linesVal').textContent = '0';
      document.getElementById('levelVal').textContent = 'Lv.1';
      document.getElementById('linesVal').textContent = '0天';
      document.getElementById('btnPause').textContent = '⏸';
      updateEnergy();
      drawHold();

      next = randomPiece();
      spawn();
      document.getElementById('startOverlay').style.display = 'none';
      document.body.classList.add('playing');
      lastDrop = performance.now();
      resizeCanvas();
    }

    // 零延遲手機觸控與滑鼠雙綁定輔助函式
    function bindFastTap(id, handler) {
      const el = document.getElementById(id);
      if (!el) return;
      let lock = false;
      const invoke = (e) => {
        if (e.cancelable) e.preventDefault();
        if (lock) return;
        lock = true;
        ensureAudio();
        handler();
        setTimeout(() => { lock = false; }, 75);
      };
      el.addEventListener('touchstart', invoke, { passive: false });
      el.addEventListener('click', invoke);
    }

    document.getElementById('btnStart').addEventListener('click', startGame);
    bindFastTap('btnLeft', () => move(-1));
    bindFastTap('btnRight', () => move(1));
    bindFastTap('btnDown', softDrop);
    bindFastTap('btnRotate', doRotate);
    bindFastTap('btnDrop', hardDrop);
    // HOLD via holdWellBox
    // // HOLD via preview box
    bindFastTap('holdWellBox', holdPiece);
    bindFastTap('btnBrownLine', brownClearLine);
    bindFastTap('btnBrownGift', brownGift);

    bindFastTap('btnPause', () => {
      if (!started) return;
      paused = !paused;
      sfxRotate();
      document.getElementById('btnPause').textContent = paused ? '▶' : '⏸';
    });

    document.getElementById('btnToggleBgm').addEventListener('click', function() {
      ensureAudio();
      bgmOn = !bgmOn;
      this.textContent = bgmOn ? '🎵 音樂' : '🔇 音樂'; this.classList.toggle('on', bgmOn);
      if (bgmOn) startBgmLoop();
      else stopBgmLoop();
    });

    const _sw = document.getElementById('btnSwitchBgmStyle'); _sw && _sw.addEventListener('click', function() {
      ensureAudio();
      bgmStyleIdx = (bgmStyleIdx + 1) % BGM_STYLES.length;
      this.textContent = BGM_STYLES[bgmStyleIdx].label;
      sfxRotate();
      if (bgmOn && !bgmTimer) startBgmLoop();
    });

    document.getElementById('btnToggleSfx').addEventListener('click', function() {
      ensureAudio();
      sfxOn = !sfxOn;
      this.textContent = sfxOn ? '🫧 音效' : '🔕 音效'; this.classList.toggle('on', sfxOn);
      if (sfxOn) sfxTestFive();
    });

    document.getElementById('btnTestBubble').addEventListener('click', () => {
      ensureAudio();
      sfxOn = true;
      document.getElementById('btnToggleSfx').textContent = '🫧 泡泡音: 開';
      sfxTestFive();
    });

    document.getElementById('btnHelp').addEventListener('click', () => {
      sfxMove();
      document.getElementById('helpModal').classList.add('show');
    });
    document.getElementById('btnCloseHelp').addEventListener('click', () => {
      sfxMove();
      document.getElementById('helpModal').classList.remove('show');
    });

    window.addEventListener('keydown', e => {
      if (!started || paused) {
        if (e.key === 'p' || e.key === 'P') {
          if (started) {
            paused = !paused;
            document.getElementById('btnPause').textContent = paused ? '▶' : '⏸';
          }
        }
        return;
      }
      switch(e.key) {
        case 'ArrowLeft': move(-1); e.preventDefault(); break;
        case 'ArrowRight': move(1); e.preventDefault(); break;
        case 'ArrowDown': softDrop(); e.preventDefault(); break;
        case 'ArrowUp': case 'z': case 'Z': doRotate(); e.preventDefault(); break;
        case ' ': hardDrop(); e.preventDefault(); break;
        case 'c': case 'C': holdPiece(); break;
        case 'b': case 'B': brownClearLine(); break;
        case 'g': case 'G': brownGift(); break;
        case 'p': case 'P':
          paused = !paused;
          document.getElementById('btnPause').textContent = paused ? '▶' : '⏸';
          break;
      }
    });

    let touchStartX=0, touchStartY=0;
    canvas.addEventListener('touchstart', e => {
      ensureAudio();
      const t = e.changedTouches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, {passive:true});
    canvas.addEventListener('touchmove', e => {
      if (started && !paused) e.preventDefault();
    }, {passive:false});
    canvas.addEventListener('touchend', e => {
      if (!started || paused) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) < 14 && Math.abs(dy) < 14) {
        doRotate();
      } else if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 1 : -1);
      } else {
        if (dy > 0) softDrop();
        else doRotate();
      }
    }, {passive:true});

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
